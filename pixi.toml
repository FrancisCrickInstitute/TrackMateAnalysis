[workspace]
authors = ["Dave Barry <david.barry@crick.ac.uk>"]
channels = ["conda-forge"]
name = "TrackMateAnalysis"
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.14.7,<3.15"

[environments]
trackmate-analysis = ["default"]

[pypi-dependencies]
jupyter = ">=1.1.1, <2"
matplotlib = ">=3.11.2, <4"
pandas = ">=3.0.6, <4"
numpy = ">=2.5.3, <3"
seaborn = ">=0.13.2, <0.14"
